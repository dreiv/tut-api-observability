<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Observability Lab</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
        background-color: #f9f9f9;
        color: #333;
      }
      header {
        margin-bottom: 2rem;
      }
      button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s;
      }
      button:hover {
        background-color: #1d4ed8;
      }
      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }
      #status-indicator {
        margin-top: 1rem;
        font-weight: 500;
      }
      pre {
        background-color: #1e1e2e;
        color: #a6adc8;
        padding: 1.5rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        font-family: "Courier New", Courier, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Invoice Management System</h1>
      <p>Observability Lab Sandbox</p>
    </header>

    <main>
      <button id="fetch-btn">Fetch Invoices</button>
      <div id="status-indicator"></div>

      <h3>API Response Payload</h3>
      <pre id="output">
// Click "Fetch Invoices" to fire an HTTP request...</pre
      >
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
